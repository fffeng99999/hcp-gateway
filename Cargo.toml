[package]
name = "hcp-gateway"
version = "0.1.0"
edition = "2021"
description = "HCP Gateway - API Gateway for High-Frequency Trading Blockchain Consensus Performance Benchmarking"
authors = ["HCP Team"]
license = "Apache-2.0"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.5", features = ["trace", "cors", "fs", "limit", "auth", "request-id", "util"] }

# gRPC
tonic = "0.13"
prost = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async utilities
futures = "0.3"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["time"] }

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.13"
dotenv = "0.15"

# UUID and time utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Crypto utilities
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
bcrypt = "0.15"
rand = "0.8"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Rate Limiting
governor = "0.6"
tower_governor = "0.4"
prost-types = "0.13"
base64 = "0.22.1"
cosmos-sdk-proto = { version = "0.27.0", features = ["default", "grpc", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[build-dependencies]
tonic-build = "0.13"

[lib]
name = "hcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "hcp-gateway"
path = "src/bin/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
