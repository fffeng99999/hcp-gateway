[package]
name = "hcp-gateway"
version = "0.1.0"
edition = "2021"
description = "HCP Gateway - API Gateway for High-Frequency Trading Blockchain Consensus Performance Benchmarking"
authors = ["HCP Team"]
license = "Apache-2.0"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.13"

# UUID and time utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database (optional, for caching)
redis = { version = "0.24", features = ["aio"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Crypto utilities
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[[bin]]
name = "hcp-gateway"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
